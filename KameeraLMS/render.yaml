services:
  - type: web
    name: Kameera-LMS
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn KameeraLMS.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: kameera-lms-db
          property: connectionString

databases:
  - name: kameera-lms-db
    databaseName: kameera_lms
    user: kameera_lms_user